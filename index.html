<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dhan Algorithmic Trading Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            padding: 20px;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid #30363d;
            margin-bottom: 25px;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            color: #2ea043;
            letter-spacing: 0.5px;
        }

        .search-container {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 500px;
        }

        input[type="text"] {
            flex: 1;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 10px 14px;
            color: #f0f6fc;
            font-size: 14px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #58a6ff;
        }

        button.btn-search {
            background-color: #238636;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            padding: 10px 20px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.btn-search:hover {
            background-color: #2ea043;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
        }

        .card-title {
            font-size: 13px;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .stock-symbol {
            font-size: 20px;
            font-weight: 700;
            color: #f0f6fc;
        }

        .stock-price {
            font-size: 32px;
            font-weight: 700;
            margin: 12px 0 6px 0;
        }

        .green { color: #3fb950; }
        .red { color: #f85149; }

        .price-change {
            font-size: 14px;
            font-weight: 600;
        }

        .status-bar {
            font-size: 12px;
            color: #8b949e;
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px dashed #30363d;
        }

        .quick-watchlist {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .chip {
            background: #21262d;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 12px;
            cursor: pointer;
            border: 1px solid #30363d;
        }

        .chip:hover {
            border-color: #58a6ff;
            color: #58a6ff;
        }
    </style>
</head>
<body>

    <div class="dashboard-header">
        <div class="logo">⚡ DHAN ALGO DASHBOARD</div>
        <div class="search-container">
            <input type="text" id="tickerInput" placeholder="Enter Ticker (e.g., RELIANCE.NS, TATAMOTORS.NS, INFY.NS)" value="RELIANCE.NS">
            <button class="btn-search" onclick="loadStockData()">Fetch Live</button>
        </div>
    </div>

    <div class="quick-watchlist">
        <span class="chip" onclick="quickFetch('RELIANCE.NS')">RELIANCE</span>
        <span class="chip" onclick="quickFetch('TCS.NS')">TCS</span>
        <span class="chip" onclick="quickFetch('INFY.NS')">INFY</span>
        <span class="chip" onclick="quickFetch('HDFCBANK.NS')">HDFC BANK</span>
        <span class="chip" onclick="quickFetch('TATAMOTORS.NS')">TATA MOTORS</span>
    </div>

    <br>

    <div class="grid-layout">
        <!-- Stock Details Card -->
        <div class="card">
            <div class="card-title">Live Market Price</div>
            <div class="stock-symbol" id="displaySymbol">RELIANCE.NS</div>
            <div class="stock-price" id="displayPrice">₹ --</div>
            <div class="price-change" id="displayChange">--</div>
            <div class="status-bar" id="statusMessage">Connected to Render Server</div>
        </div>

        <!-- Big Player / Algo Status Card -->
        <div class="card">
            <div class="card-title">Algorithmic Signal</div>
            <div style="font-size: 18px; font-weight: 600; margin-top: 10px; color: #58a6ff;" id="signalText">
                Analyzing Volume & Price Movement...
            </div>
            <p style="font-size: 13px; color: #8b949e; margin-top: 10px;">
                Automated detection based on real-time proxy data from Render backend.
            </p>
        </div>
    </div>

    <script>
        // Connected directly to your live Render backend
        const RENDER_BACKEND_URL = "https://dhan-bot-backend.onrender.com";

        async function loadStockData() {
            const symbol = document.getElementById('tickerInput').value.trim().toUpperCase();
            if (!symbol) return;

            const priceEl = document.getElementById('displayPrice');
            const changeEl = document.getElementById('displayChange');
            const symbolEl = document.getElementById('displaySymbol');
            const statusEl = document.getElementById('statusMessage');
            const signalEl = document.getElementById('signalText');

            statusEl.innerText = "Fetching live data...";
            priceEl.innerText = "₹ Loading...";

            try {
                const response = await fetch(`${RENDER_BACKEND_URL}/api/stock/${symbol}`);
                const data = await response.json();

                if (data.error) {
                    statusEl.innerText = `Error: ${data.error}`;
                    priceEl.innerText = "N/A";
                    changeEl.innerText = "";
                    signalEl.innerText = "No Signal Available";
                } else {
                    symbolEl.innerText = data.symbol;
                    priceEl.innerText = `₹ ${data.price.toFixed(2)}`;
                    
                    const isPositive = data.change >= 0;
                    changeEl.innerText = `${isPositive ? '+' : ''}${data.change.toFixed(2)} Today`;
                    changeEl.className = `price-change ${isPositive ? 'green' : 'red'}`;

                    statusEl.innerText = `Last Updated: ${new Date().toLocaleTimeString()}`;

                    // Signal calculation logic
                    if (isPositive) {
                        signalEl.innerText = "🟢 BULLISH DETECTED (Buying Momentum)";
                        signalEl.style.color = "#3fb950";
                    } else {
                        signalEl.innerText = "🔴 BEARISH DETECTED (Selling Pressure)";
                        signalEl.style.color = "#f85149";
                    }
                }
            } catch (err) {
                console.error(err);
                statusEl.innerText = "Backend connection failed. Service may be starting up.";
                priceEl.innerText = "Error";
            }
        }

        function quickFetch(ticker) {
            document.getElementById('tickerInput').value = ticker;
            loadStockData();
        }

        // Page load hone par default stock fetch karein
        window.onload = () => {
            loadStockData();
        };
    </script>
</body>
</html>
