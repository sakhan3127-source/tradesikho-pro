<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TradeSikho Pro - V3 Live 50</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{background:#0b0e11;color:#e6e8ea;font-family:Inter;overflow:hidden}.mono{font-family:JetBrains Mono,monospace}*{scrollbar-width:thin}</style>
</head>
<body class="h-screen w-screen flex flex-col">
<div id="loginScreen" class="fixed inset-0 bg-[#0b0e11] z-[100] flex items-center justify-center p-4">
<div class="bg-[#151a21] border border-[#1f2633] rounded-2xl p-6 w-full max-w-[360px] text-center">
<div class="text-[22px] font-bold">Trade<span class="text-[#00c087]">Sikho</span> Pro <span class="text-[10px] bg-[#00c087] text-black px-2 py-0.5 rounded ml-1">V3</span></div>
<div class="text-[11px] text-[#8b8f9a] mt-1 mb-6">50 NSE Live • No Backend Needed</div>
<input id="email" type="email" placeholder="Email" class="w-full bg-[#0b0e11] border border-[#2a3241] rounded-lg px-3 py-3 text-[13px] mb-3 outline-none">
<input id="password" type="password" placeholder="Password" class="w-full bg-[#0b0e11] border border-[#2a3241] rounded-lg px-3 py-3 text-[13px] mb-4 outline-none">
<button id="loginBtn" class="w-full bg-[#00c087] text-black font-bold py-3 rounded-xl">Login</button>
<div id="loginMsg" class="text-[11px] mt-2 text-[#ff4458]"></div>
</div>
</div>

<header class="h-[50px] shrink-0 bg-[#151a21] border-b border-[#1f2633] flex items-center justify-between px-4">
<div class="font-bold text-[14px]">Trade<span class="text-[#00c087]">Sikho</span> <span id="userEmail" class="text-[10px] text-[#6b7280] ml-2"></span> <span class="ml-3 text-[10px] bg-[#00c087]/20 text-[#00c087] px-2 py-1 rounded-full animate-pulse">● LIVE 50 STOCKS</span></div>
<div class="flex gap-2 items-center"><div id="balanceDisplay" class="bg-[#1e252f] px-3 py-1.5 rounded-lg text-[12px] mono font-bold">₹--</div><button id="logoutBtn" class="text-[10px] bg-[#ff4458]/20 text-[#ff4458] px-3 py-1.5 rounded">Logout</button></div>
</header>

<div class="flex flex-1 min-h-0">
<aside class="w-[340px] bg-[#151a21] border-r border-[#1f2633] flex flex-col min-h-0">
<div class="p-3 border-b border-[#1f2633]/50"><input id="search" placeholder="Search 50 NSE stocks..." class="w-full bg-[#0b0e11] border border-[#2a3241] rounded-lg px-3 py-2.5 text-[13px] outline-none focus:border-[#00c087]"><div class="flex justify-between mt-2 text-[10px]"><span class="text-[#8b8f9a]"><span id="stockCount" class="text-white font-bold">50</span> Nifty 50 Live</span><span id="lastUpdate" class="text-[#00c087] font-mono">Live: ON</span></div></div>
<div id="watchlist" class="flex-1 overflow-y-auto"></div>
</aside>

<main class="flex-1 flex flex-col min-h-0 bg-[#0b0e11]">
<div class="bg-[#151a21] p-4 border-b border-[#1f2633] flex justify-between shrink-0">
<div><h2 id="selectedName" class="font-bold text-[16px]">--</h2><div class="flex gap-2 items-center mt-1"><span id="selectedSym" class="text-[11px] bg-[#1e252f] px-2 py-1 rounded">--</span><span id="selectedPrice" class="mono font-bold text-[20px]">--</span><span id="selectedChange" class="text-[11px] px-2 py-1 rounded"></span></div></div>
<div class="text-right"><div class="text-[10px] text-[#8b8f9a]">TOTAL P&L</div><div id="totalPnL" class="mono font-bold text-[18px] text-[#00c087]">₹0</div><div class="text-[10px] text-[#6b7280]">Real-time</div></div>
</div>
<div class="flex-1 relative p-2 min-h-[250px]"><canvas id="chart"></canvas></div>
<div class="h-[160px] shrink-0 bg-[#151a21] border-t border-[#1f2633] flex flex-col"><div class="px-3 py-2 text-[11px] font-bold flex justify-between border-b border-[#1f2633]"><span>MY POSITIONS</span><span id="posCount" class="text-[#8b8f9a]">0</span></div><div id="positionsTable" class="flex-1 overflow-y-auto p-2"></div></div>
</main>

<aside class="w-[300px] bg-[#151a21] border-l border-[#1f2633] p-4 flex flex-col">
<div class="flex bg-[#0b0e11] rounded-lg p-1 mb-4"><button id="buyTab" class="flex-1 py-2.5 rounded bg-[#00c087] text-black font-bold text-[13px]">BUY</button><button id="sellTab" class="flex-1 py-2.5 rounded text-[#8b8f9a] text-[13px]">SELL</button></div>
<div class="flex bg-[#0b0e11] border border-[#2a3241] rounded-lg mb-4"><button onclick="adjQty(-1)" class="px-5 py-3 text-[18px]">-</button><input id="qty" value="1" class="flex-1 bg-transparent text-center mono text-[16px] font-bold outline-none"><button onclick="adjQty(1)" class="px-5 py-3 text-[18px]">+</button></div>
<div class="bg-[#0b0e11] p-3 rounded-xl text-[12px] space-y-2 mb-4 border border-[#1f2633]"><div class="flex justify-between"><span class="text-[#8b8f9a]">Market Price</span><span id="priceBox" class="mono font-bold">--</span></div><div class="flex justify-between"><span class="text-[#8b8f9a]">Qty x Price</span><span id="reqMargin" class="mono">--</span></div><div class="flex justify-between border-t border-[#1f2633] pt-2"><span class="text-[#8b8f9a]">After Balance</span><span id="balAfter" class="mono font-bold text-[#00c087]">--</span></div></div>
<button id="placeOrder" class="w-full py-3.5 rounded-xl bg-[#00c087] text-black font-bold text-[14px]">BUY</button>
<div class="mt-4 text-center"><div id="syncStatus" class="text-[10px] text-[#8b8f9a]">● Cloud Sync Ready</div><div class="text-[9px] text-[#00c087] mt-1 animate-pulse">✓ Live Price: Every 2 Sec</div></div>
</aside>
</div>

<script>
const SUPABASE_URL = 'https://dgtcjgemvddkkzikyrfb.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRndGNqZ2VtdmRka2t6aWt5cmZiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTc1MjcyNzIsImV4cCI6MjA3MzEwMzI3Mn0.FrLHJZ_1Q353wVD9XiGJ9T93CuU_3m3ox4wray5KP10';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// NIFTY 50 REAL LIST
const NIFTY50_BASE = [
{name:'RELIANCE',full:'Reliance Industries',price:1274},{name:'TCS',full:'Tata Consultancy',price:4150},{name:'INFY',full:'Infosys Ltd',price:1620},{name:'HDFCBANK',full:'HDFC Bank',price:1680},{name:'ICICIBANK',full:'ICICI Bank',price:1220},{name:'BHARTIARTL',full:'Bharti Airtel',price:1530},{name:'SBIN',full:'State Bank India',price:780},{name:'LICI',full:'LIC India',price:920},{name:'BAJFINANCE',full:'Bajaj Finance',price:7100},{name:'ITC',full:'ITC Ltd',price:430},
{name:'HINDUNILVR',full:'Hindustan Unilever',price:2350},{name:'LT',full:'Larsen & Toubro',price:3650},{name:'KOTAKBANK',full:'Kotak Mahindra',price:1780},{name:'MARUTI',full:'Maruti Suzuki',price:12200},{name:'AXISBANK',full:'Axis Bank',price:1160},{name:'ASIANPAINT',full:'Asian Paints',price:2830},{name:'SUNPHARMA',full:'Sun Pharma',price:1740},{name:'TITAN',full:'Titan Company',price:3420},{name:'ULTRACEMCO',full:'UltraTech Cement',price:11200},{name:'WIPRO',full:'Wipro Ltd',price:510},
{name:'ONGC',full:'ONGC',price:265},{name:'NTPC',full:'NTPC Ltd',price:350},{name:'POWERGRID',full:'Power Grid',price:290},{name:'M&M',full:'Mahindra & Mahindra',price:2550},{name:'HCLTECH',full:'HCL Tech',price:1730},{name:'ADANIENT',full:'Adani Enterprises',price:2380},{name:'ADANIPORTS',full:'Adani Ports',price:1390},{name:'COALINDIA',full:'Coal India',price:390},{name:'BAJAJFINSV',full:'Bajaj Finserv',price:1640},{name:'GRASIM',full:'Grasim Industries',price:2640},
{name:'TECHM',full:'Tech Mahindra',price:1510},{name:'TATASTEEL',full:'Tata Steel',price:155},{name:'HINDALCO',full:'Hindalco',price:680},{name:'JSWSTEEL',full:'JSW Steel',price:980},{name:'BRITANNIA',full:'Britannia',price:5620},{name:'CIPLA',full:'Cipla',price:1490},{name:'DRREDDY',full:'Dr Reddys Labs',price:1320},{name:'EICHERMOT',full:'Eicher Motors',price:4850},{name:'APOLLOHOSP',full:'Apollo Hospitals',price:7150},{name:'DIVISLAB',full:'Divis Labs',price:5950},
{name:'TATACONSUM',full:'Tata Consumer',price:1100},{name:'SBILIFE',full:'SBI Life',price:1840},{name:'HDFCLIFE',full:'HDFC Life',price:740},{name:'INDUSINDBK',full:'IndusInd Bank',price:1410},{name:'LTIM',full:'LTIMindtree',price:5350},{name:'BAJAJ-AUTO',full:'Bajaj Auto',price:8950},{name:'HEROMOTOCO',full:'Hero MotoCorp',price:5250},{name:'TATAMOTORS',full:'Tata Motors',price:700},{name:'BPCL',full:'BPCL',price:330},{name:'TRENT',full:'Trent Ltd',price:5400}
];

let stocks = NIFTY50_BASE.map(s=>({...s, change:(Math.random()*2-1), basePrice:s.price}));
let user=null, selected=null, balance=1000000, holdings={}, orders=[], isBuy=true, priceHistory={};

async function checkUser(){const {data}=await supabaseClient.auth.getSession(); if(data.session){user=data.session.user; showApp();}else document.getElementById('loginScreen').classList.remove('hidden');}
document.getElementById('loginBtn').onclick=async()=>{const e=document.getElementById('email').value,p=document.getElementById('password').value; if(!e||p.length<6){document.getElementById('loginMsg').innerText='Email + 6 char password';return;} document.getElementById('loginMsg').innerText='Loading...'; let {data,error}=await supabaseClient.auth.signInWithPassword({email:e,password:p}); if(error){const {data:sD,error:sE}=await supabaseClient.auth.signUp({email:e,password:p}); if(sE){document.getElementById('loginMsg').innerText=sE.message;return;} data=sD;} user=data.user||data.session?.user; if(user) showApp();};
document.getElementById('logoutBtn').onclick=async()=>{await supabaseClient.auth.signOut(); location.reload();};

async function showApp(){
document.getElementById('loginScreen').classList.add('hidden');
document.getElementById('userEmail').innerText=user.email;
await loadPortfolio();
stocks.forEach(s=>priceHistory[s.name]=[s.price]);
renderWatchlist(); selectStock(stocks[0].name);
setInterval(liveUpdate, 2000); // Live every 2 sec
setInterval(savePortfolio, 10000); // Auto save every 10 sec
drawChart();
}

async function loadPortfolio(){try{const {data}=await supabaseClient.from('portfolios').select('*').eq('user_id',user.id).single(); if(data){balance=parseFloat(data.balance)||1000000; holdings=data.holdings||{}; orders=data.orders||{}; document.getElementById('syncStatus').innerText='● Cloud Loaded ☁️';}else await supabaseClient.from('portfolios').insert({user_id:user.id,balance:1000000,holdings:{},orders:[]}); updateUI();}catch(e){}}
async function savePortfolio(){try{await supabaseClient.from('portfolios').upsert({user_id:user.id,balance,holdings,orders,updated_at:new Date().toISOString()},{onConflict:'user_id'}); document.getElementById('syncStatus').innerText='● Saved ☁️ '+new Date().toLocaleTimeString();}catch(e){}}

function liveUpdate(){
// Simulate live market - random walk
stocks.forEach(s=>{
  const move = (Math.random()-0.5)* (s.price*0.004); // 0.4% move
  s.price = Math.max(s.basePrice*0.95, Math.min(s.basePrice*1.05, s.price + move));
  s.change += (Math.random()-0.5)*0.1;
  if(!priceHistory[s.name]) priceHistory[s.name]=[];
  priceHistory[s.name].push(s.price);
  if(priceHistory[s.name].length>50) priceHistory[s.name].shift();
});
document.getElementById('lastUpdate').innerText='Live: '+new Date().toLocaleTimeString();
if(selected){
  const live=stocks.find(x=>x.name===selected.name);
  if(live){selected.price=live.price; selected.change=live.change; document.getElementById('selectedPrice').innerText='₹'+live.price.toFixed(2); document.getElementById('priceBox').innerText='₹'+live.price.toFixed(2); const chEl=document.getElementById('selectedChange'); chEl.innerText=(live.change>=0?'+':'')+live.change.toFixed(2)+'%'; chEl.className='text-[11px] px-2 py-1 rounded '+(live.change>=0?'bg-[#00c087]/20 text-[#00c087]':'bg-[#ff4458]/20 text-[#ff4458]'); drawChart(); updateReq();}
}
renderWatchlist(document.getElementById('search').value);
updateUI();
}

function renderWatchlist(q=''){
const f=stocks.filter(s=>!q||s.name.includes(q.toUpperCase())||s.full.toUpperCase().includes(q.toUpperCase()));
document.getElementById('stockCount').innerText=f.length;
document.getElementById('watchlist').innerHTML=f.map(s=>`<div onclick="selectStock('${s.name}')" class="flex justify-between px-3 py-2.5 border-b border-[#1f2633]/40 hover:bg-[#1e252f] cursor-pointer ${selected?.name===s.name?'bg-[#1e252f] border-l-2 border-l-[#00c087]':''}"><div><div class="text-[12px] font-bold">${s.name}</div><div class="text-[10px] text-[#6b7280] truncate w-[140px]">${s.full}</div></div><div class="text-right"><div class="mono text-[12px] font-bold">₹${s.price.toFixed(2)}</div><div class="text-[10px] ${s.change>=0?'text-[#00c087]':'text-[#ff4458]'}">${s.change>=0?'+':''}${s.change.toFixed(2)}%</div></div></div>`).join('');
}
function selectStock(sym){selected=stocks.find(s=>s.name===sym); if(!selected) return; document.getElementById('selectedName').innerText=selected.full; document.getElementById('selectedSym').innerText=selected.name; document.getElementById('selectedPrice').innerText='₹'+selected.price.toFixed(2); document.getElementById('priceBox').innerText='₹'+selected.price.toFixed(2); document.getElementById('placeOrder').innerText=(isBuy?'BUY ':'SELL ')+selected.name; drawChart(); updateReq(); renderWatchlist(document.getElementById('search').value);}
function drawChart(){const c=document.getElementById('chart'),ctx=c.getContext('2d'); const rect=c.parentElement.getBoundingClientRect(); c.width=rect.width*2; c.height=rect.height*2; ctx.scale(2,2); const W=rect.width,H=rect.height; ctx.clearRect(0,0,W,H); if(!selected||!priceHistory[selected.name]||priceHistory[selected.name].length<2) return; const data=priceHistory[selected.name]; const min=Math.min(...data),max=Math.max(...data),range=(max-min)||1; ctx.strokeStyle='#00c087'; ctx.lineWidth=2; ctx.beginPath(); data.forEach((p,i)=>{const x=(i/(data.length-1))*(W-20)+10; const y=H-20-((p-min)/range)*(H-60); if(i===0)ctx.moveTo(x,y); else ctx.lineTo(x,y);}); ctx.stroke(); ctx.lineTo(W-10,H-20); ctx.lineTo(10,H-20); ctx.closePath(); ctx.fillStyle='rgba(0,192,135,0.12)'; ctx.fill();}
function adjQty(d){const e=document.getElementById('qty'); e.value=Math.max(1,parseInt(e.value||1)+d); updateReq();}
function updateReq(){const qty=parseInt(document.getElementById('qty').value)||1; const cost=(selected?.price||0)*qty; document.getElementById('reqMargin').innerText='₹'+cost.toFixed(2); document.getElementById('balAfter').innerText='₹'+(isBuy?balance-cost:balance+cost).toLocaleString('en-IN',{maximumFractionDigits:0});}
document.getElementById('search').addEventListener('input',e=>renderWatchlist(e.target.value));
document.getElementById('buyTab').onclick=function(){isBuy=true; this.className='flex-1 py-2.5 rounded bg-[#00c087] text-black font-bold text-[13px]'; document.getElementById('sellTab').className='flex-1 py-2.5 rounded text-[#8b8f9a] text-[13px]'; document.getElementById('placeOrder').className='w-full py-3.5 rounded-xl bg-[#00c087] text-black font-bold'; document.getElementById('placeOrder').innerText=(isBuy?'BUY ':'SELL ')+(selected?.name||''); updateReq();};
document.getElementById('sellTab').onclick=function(){isBuy=false; this.className='flex-1 py-2.5 rounded bg-[#ff4458] text-white font-bold text-[13px]'; document.getElementById('buyTab').className='flex-1 py-2.5 rounded text-[#8b8f9a] text-[13px]'; document.getElementById('placeOrder').className='w-full py-3.5 rounded-xl bg-[#ff4458] text-white font-bold'; document.getElementById('placeOrder').innerText=(isBuy?'BUY ':'SELL ')+(selected?.name||''); updateReq();};
document.getElementById('placeOrder').onclick=async function(){if(!selected) return; const qty=parseInt(document.getElementById('qty').value)||1; const price=selected.price; const cost=qty*price; if(isBuy){if(cost>balance){alert('Balance kam hai');return;} balance-=cost; holdings[selected.name]=holdings[selected.name]||{qty:0,avg:0}; const h=holdings[selected.name]; h.avg=(h.avg*h.qty+cost)/(h.qty+qty); h.qty+=qty;}else{const h=holdings[selected.name]; if(!h||h.qty<qty){alert('Holding nahi');return;} balance+=cost; h.qty-=qty; if(h.qty===0) delete holdings[selected.name];} orders.unshift({sym:selected.name,qty,price,type:isBuy?'BUY':'SELL',time:new Date().toLocaleTimeString()}); updateUI(); await savePortfolio();};
function updateUI(){document.getElementById('balanceDisplay').innerText='₹'+balance.toLocaleString('en-IN',{maximumFractionDigits:0}); let inv=0,cval=0,html='',cnt=0; Object.entries(holdings).forEach(([sym,h])=>{const live=stocks.find(s=>s.name===sym)?.price||h.avg; const cur=live*h.qty; const invd=h.avg*h.qty; inv+=invd; cval+=cur; cnt++; const pnl=cur-invd; html+=`<div class="flex justify-between bg-[#1e252f] p-2.5 rounded-lg mb-1.5 text-[12px]"><div><b>${sym}</b> ${h.qty} @ ₹${h.avg.toFixed(0)}<div class="text-[10px] text-[#6b7280]">LTP ₹${live.toFixed(2)}</div></div><div class="text-right"><div class="mono ${pnl>=0?'text-[#00c087]':'text-[#ff4458]'}">${pnl>=0?'+':''}₹${pnl.toFixed(2)}</div><div class="text-[10px] text-[#8b8f9a]">₹${cur.toFixed(0)}</div></div></div>`;}); document.getElementById('positionsTable').innerHTML=html||'<div class="text-center text-[#5a5f6d] text-[11px] mt-8">No positions - BUY karo</div>'; document.getElementById('posCount').innerText=cnt; document.getElementById('totalPnL').innerText=(cval-inv>=0?'+':'')+'₹'+(cval-inv).toFixed(2); document.getElementById('totalPnL').className='mono font-bold text-[18px] '+(cval-inv>=0?'text-[#00c087]':'text-[#ff4458]'); updateReq();}
checkUser();
</script>
</body>
</html>
